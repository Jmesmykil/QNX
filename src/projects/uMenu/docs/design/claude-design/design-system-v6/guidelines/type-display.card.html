<!-- @dsCard group="Type" viewport="700x200" name="Display — Newsreader italic" subtitle="The elegant serif wordmark; premium framing over homebrew" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 26px 28px; background: #0A0A14; }
  .qos-void { position: absolute; inset: 0; z-index: 0; }
  .wm { position: relative; z-index: 1; font-family: var(--font-display); font-style: italic;
        color: var(--text-primary); letter-spacing: -.02em; line-height: 1; }
  .big { font-size: 62px; font-weight: 500; }
  .sub { position: relative; z-index: 1; font-family: var(--font-sans); font-size: 18px; font-weight: 400;
         color: var(--text-secondary); margin-top: 14px; }
  .meta { position: relative; z-index: 1; font-family: var(--font-mono); font-size: 11px; color: var(--accent);
          letter-spacing: .1em; margin-top: 16px; text-transform: uppercase; }
</style>
</head>
<body class="qos-void">
  <div class="wm big">Q OS uMenu</div>
  <div class="sub">A windowed desktop OS for Nintendo Switch.</div>
  <div class="meta">Newsreader · italic · 400–600</div>
</body>
</html>
