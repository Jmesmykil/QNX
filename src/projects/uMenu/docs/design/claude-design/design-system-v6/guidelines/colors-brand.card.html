<!-- @dsCard group="Colors" viewport="700x180" name="Brand palette" subtitle="Electric cyan signature + magenta & lavender pops on navy" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 22px; background: #0A0A14; }
  .row { display: flex; gap: 14px; }
  .sw { flex: 1; border-radius: 10px; overflow: hidden; border: 1px solid rgba(255,255,255,.08); }
  .chip { height: 78px; }
  .meta { padding: 8px 10px; background: rgba(255,255,255,.03); }
  .name { font-family: var(--font-sans); font-size: 12px; font-weight: 600; color: var(--text-primary); }
  .hex { font-family: var(--font-mono); font-size: 11px; color: var(--text-secondary); margin-top: 2px; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:#00E5FF"></div><div class="meta"><div class="name">Brand Cyan</div><div class="hex">#00E5FF</div></div></div>
    <div class="sw"><div class="chip" style="background:#D946EF"></div><div class="meta"><div class="name">Magenta</div><div class="hex">#D946EF</div></div></div>
    <div class="sw"><div class="chip" style="background:#A78BFA"></div><div class="meta"><div class="name">Lavender</div><div class="hex">#A78BFA</div></div></div>
    <div class="sw"><div class="chip" style="background:#0E1A33"></div><div class="meta"><div class="name">Navy</div><div class="hex">#0E1A33</div></div></div>
    <div class="sw"><div class="chip" style="background:#FFFFFF"></div><div class="meta"><div class="name">White</div><div class="hex">#FFFFFF</div></div></div>
  </div>
</body>
</html>
