<!-- @dsCard group="Brand" viewport="760x230" name="Hero banner" subtitle="The all-in-one statement on the void" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; height: 100vh; overflow: hidden; }
  .hero { position: relative; width: 100%; height: 100%; display: flex; align-items: center; gap: 34px; padding: 0 48px; box-sizing: border-box; }
  /* glowing Q bubble */
  .bubble { position: relative; width: 150px; height: 150px; flex: none; display: grid; place-items: center; }
  .ring { position: absolute; inset: 14px; border-radius: 999px; border: 3px solid var(--brand-cyan);
          box-shadow: 0 0 40px -4px var(--brand-cyan), inset 0 0 30px -6px var(--brand-cyan); }
  .ring::after { content: ""; position: absolute; right: -4px; bottom: 2px; width: 30px; height: 6px; border-radius: 4px;
                 background: var(--brand-cyan); transform: rotate(45deg); box-shadow: 0 0 14px var(--brand-cyan); }
  .qm { font-family: var(--font-display); font-style: italic; font-weight: 600; font-size: 78px; line-height: 1;
        color: #EAF6FF; text-shadow: 0 0 26px rgba(0,229,255,.6); }
  .orbs { position: absolute; left: 8px; bottom: 8px; display: flex; gap: 10px; align-items: flex-end; }
  .orb { border-radius: 999px; }
  .o1 { width: 16px; height: 16px; background: var(--brand-magenta); box-shadow: 0 0 18px 3px var(--brand-magenta); }
  .o2 { width: 11px; height: 11px; background: var(--brand-lavender); box-shadow: 0 0 14px 2px var(--brand-lavender); }
  /* text block */
  .txt { position: relative; z-index: 1; }
  .wm { font-family: var(--font-display); font-style: italic; font-weight: 600; font-size: 52px; letter-spacing: -.02em; color: #fff; line-height: 1; }
  .tag { font-family: var(--font-sans); font-size: 21px; font-weight: 400; color: var(--text-primary); margin-top: 12px; }
  .tag b { color: var(--brand-cyan); font-weight: 600; }
  .feats { display: flex; gap: 18px; margin-top: 18px; }
  .feat { display: inline-flex; align-items: center; gap: 7px; font-family: var(--font-mono); font-size: 11px; letter-spacing: .04em;
          color: var(--text-secondary); text-transform: uppercase; }
  .feat svg { width: 15px; height: 15px; fill: none; stroke: var(--brand-cyan); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .chroma { position: absolute; right: -60px; top: 50%; transform: translateY(-50%); width: 320px; height: 320px; border-radius: 999px;
            background: conic-gradient(from 0deg, #00E5FF, #A78BFA, #D946EF, #00E5FF); filter: blur(70px); opacity: .25; pointer-events: none; }
</style>
</head>
<body class="qos-void">
  <svg width="0" height="0" style="position:absolute"><defs>
    <symbol id="win" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M4 9 h16"/></symbol>
    <symbol id="dock" viewBox="0 0 24 24"><rect x="3" y="14" width="18" height="5" rx="2"/><circle cx="7" cy="16.5" r="0.6"/><circle cx="12" cy="16.5" r="0.6"/></symbol>
    <symbol id="fold" viewBox="0 0 24 24"><path d="M4 7.5 h5 l2 2 h9 v8 H4 Z"/></symbol>
    <symbol id="theme" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4 a8 8 0 0 1 0 16"/></symbol>
  </defs></svg>
  <div class="hero">
    <div class="chroma"></div>
    <div class="bubble"><div class="ring"></div><span class="qm">Q</span>
      <div class="orbs"><span class="orb o1"></span><span class="orb o2"></span></div></div>
    <div class="txt">
      <div class="wm">Q OS uMenu</div>
      <div class="tag">Your whole Switch — <b>games, homebrew, files, saves &amp; cheats</b> — in one windowed desktop.</div>
      <div class="feats">
        <span class="feat"><svg><use href="#win"/></svg>Windows</span>
        <span class="feat"><svg><use href="#dock"/></svg>Dock</span>
        <span class="feat"><svg><use href="#fold"/></svg>Auto-folders</span>
        <span class="feat"><svg><use href="#theme"/></svg>10 themes</span>
      </div>
    </div>
  </div>
</body>
</html>
