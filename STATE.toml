[blocker_home_from_game]
REGRESSION_CORRECTION_2026_06_21 = "CREATOR ANCHOR: HOME-from-game WORKED at v3.7.0 (commit 9aa774e9, pushed to GitHub) -> the black screen is a REGRESSION in the UNCOMMITTED v3.7.0->v3.7.62 autonomous changes, NOT fundamental. SUPERSEDES every conclusion below (fundamental am-limit, am_binary_RE foreground theory, am IPS patch -- ALL WRONG). NEXT (fresh context): git -C tools/qos-ulaunch-fork diff HEAD -- src/projects/uSystem/source (HEAD~=v3.7.0, worktree=v3.7.62 broken); focus the post-game relaunch (main.cpp HandleHomeButton / g_TerminatingApp ~2011 / safety-net ~2247 / watchdog ~2160; la_LibraryApplet.cpp Create; app_Application; ecs_ExternalContent) -> find + revert the specific breaking change. Device v3.7.62 broken, QOS restored, autoboot=0. PAUSED at creator request (context 99%)."
regfix_progress_2026_06_22 = "PARTIAL FIX. Workflow w588u3687 found the regression = the post-v3.7.0 HOME-over-game rewrite (terminate + PRIME-RECREATE double-create) replacing v3.7.0's SUSPEND. Applied ranks 1+2 to main.cpp: (1) HandleHomeButton APP branch restored to v3.7.0 (sys::SetForeground + LaunchMenu(MainMenu) = suspend the game, no terminate); (2) deleted the g_TerminatingApp MainLoop double-create block. Built (601846 bytes), deployed (exefs.nsp), autoboot restored to 4, rebooted, HW-tested HOME-from-game (SMG2 idx 69). RESULT: the 0x4680 CRASH-LOOP IS GONE -- uSystem launches uMenu ONCE, no 0x4680, no loop, uSystem idle (BIG progress, regression theory CONFIRMED). BUT uMenu#2 post-HOME HANGS: it launches (am accepts, no 0x4680) but writes NO uMenu log + :6010/ping dead = it never runs its code (uMenu#1 boot renders fine, so it is uMenu#2-post-game-specific). NEXT (fresh context -- was 99%): READ full output /private/tmp/claude-501/-Users-astral/d0ec576f-4293-4196-96e6-c6e9881c6bdb/tasks/w588u3687.output for rank-3+ reverts -- ONLY ranks 1+2 applied; la_LibraryApplet.cpp::Create changed +152 lines since v3.7.0 (the v3.7.53 always-close-holder + v3.7.61 cmd-25 hardening) and is NOT reverted -- likely the remaining regression. Restore v3.7.0 la::Create (git show HEAD:tools/qos-ulaunch-fork/src/projects/uSystem/source/ul/system/la/la_LibraryApplet.cpp), rebuild, re-test. On the right track; MenuStartMode::MainMenu=3 confirmed correct."
symptom    = "HOME-from-game -> BLACK/stall (in-session uMenu#2 relaunch crash-loops)"
root_cause = "uMenu#2 process is TERMINATED with am 2128-0035 (0x4680, exitreason=2) BEFORE __appInit runs — TRACE-PROVEN 2026-06-21: cleared umenu_early_trace.log, ran HOME-from-game, uMenu#2 wrote 0 lines (dies in crt0/core-libnx-init, before any uMenu code). uMenu is launched DIRECTLY via ecs::RegisterLaunchAsApplet('/ulaunch/bin/uMenu') — NOT via uLoader (uLoader is only for homebrew NROs; instrumenting it was a dead end). So am kills the 2nd in-session library-applet process at/just-after creation. uSystem 'no applet active' handler relaunches -> loops = the stall."
ruled_out  = "NOT foreground: v3.7.55 added sys::SetForeground before relaunch (trace 'APP: reclaiming foreground' fired) -> still 0x4680. NOT timing: v3.7.57 added 2s settle (tick-gap confirms wait) -> still 0x4680. My earlier 'missing SetForeground' fix was WRONG (honest)."
not_a_hard_limit = "cmd_resetmenu RELIABLY recovers uMenu IN-SESSION (creator-confirmed) -> a 2nd in-session uMenu IS creatable, so it is NOT a fundamental am limit. The prior 'UNFIXABLE am limit' conclusion was premature."
key_lead   = "ROOT CAUSE (high-confidence, 2026-06-21): la::Create (la_LibraryApplet.cpp) releases the am library-applet slot via appletHolderRequestExitOrTerminate ONLY in its LIVE-holder branch (lines ~58-61). Its FINISHED-holder branch (~75-91) does Join+Close but NOT RequestExitOrTerminate. When uMenu#1 SELF-EXITS to launch a game, its holder is FINISHED -> the slot is never released (cmd-25 never sent) -> am's per-proxy-session quota stays held -> the next create (uMenu#2 after HOME) is rejected 2128-0035. cmd_resetmenu RECOVERS precisely because it catches the holder LIVE (its la::ForceTerminateNow / Create's live branch sends RequestExitOrTerminate = slot released). This RECONCILES 'cmd_resetmenu works yet doc said background-create always fails' — it's slot-state, not caller-type."
cmd25_finished_FAILED = "v3.7.61 added appletHolderTerminate (cmd 25) to la::Create's finished-holder path -> Terminate ran cleanly (no error log) yet uMenu#2 STILL exited 0x4680, 0 early-trace lines, crash-loop. So cmd-25-on-a-FINISHED-holder does NOT release the am slot. 3rd band-aid ruled out (after foreground + timing)."
CONCLUSION = "3-AGENT AUDIT (wxu62ads6, 2026-06-21) UNANIMOUS + my 3 empirical failures: this is am's ONE-LIVE-LIBRARY-APPLET-PER-SYSTEMAPPLET limit for cmd-4 (appletCreateLibraryApplet) BACKGROUND callers (uSystem). A 2nd in-session cmd-4 create is rejected 2128-0035. Band-aids from uSystem/uMenu CANNOT reach it. ROOT-LEVEL FIX = am IPS patch widening the one-holder limit (= F_absorption, the creator's absorption go-point) — which ALSO enables NROs-as-windows (multi-holder). cmd-10 appletCreateLibraryAppletSelf (foreground self-create from uMenu) is the OTHER native path (QOS has a partial LaunchHomebrewWindowed on it) but doesn't apply post-game (no foreground uMenu to self-create). Full architecture + 73 optimization findings: docs/OPTIMIZATION_FINDINGS.md. INTERIM option: auto graceful-recovery (uSystem detects N consecutive 0x4680 relaunch fails -> RebootToHekate self-heal) so HOME-from-game never permanently blacks."
