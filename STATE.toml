am_binary_RE_2026_06_21 = "BREAKTHROUGH — RE'd the EXTRACTED am NSO (buildid e3722da984d9ed4adbfebf8f4f9b1050996f3fc3 = THIS device's am, pulled from emuMMC via Hekate UMS + BIS-XTS decrypt + hactool). The 0x4680 is am TRANSLATING a deeper NS error, NOT an am limit. am's applet-launch error-translator = fcn @ vaddr 0x8052380 (base 0x8000000); PROOF of identity: it maps launch result 0x410 -> am desc 37 'Title-ID not found', which matches Switchbrew EXACTLY. That fn maps NS results (module 16 = NS) 0x28010/0x28210 -> 0x4680, AND its DEFAULT/unmatched branch (0x8052780) ALSO -> 0x4680. am 2128-0035 = 'Error while launching applet' (Switchbrew). So the underlying failure is an NS launch REJECTION (2016-xxxx) that am merely relabels. Create+Start SUCCEED (uSystem reads 0x4680 via holder GetResult cmd 30 = the DIAG-L2 log); the failure is INSIDE am's launch (its NS call), invisible to uSystem instrumentation. The 8 candidate 0x4680 sites: 4 were struct-offset false positives, 1 is a 'must not be called more than once' singleton assert (str @0x8150d36), the launch-translator is the real one. IMPLICATION: the planned am IPS patch (F_absorption / the 3-agent-audit conclusion) is the WRONG + DANGEROUS target — making am's translator 'succeed' hands uSystem a half-launched applet -> instability/crash. NS is the rejecter. REAL fix space = the NS rejection condition (launch IDENTITY/CONTEXT): uMenu masquerades as a stdlib library applet (g_LibraryAppletTable, menu likely PlayerSelect) launched LibAppletMode_AllForeground by uSystem AFTER an application session; NS accepts this at boot but refuses post-app. NEXT (safe, no core patch): capture the real NS result (am logs the untranslated result via diag fcn.08040dec but does NOT abort, so there is no crash report -> need on-device experiment), then try an alternate AppletId / launch-context so NS accepts the post-game relaunch. Artifacts persist in /tmp: am_text/rodata/data.bin, am.nca, am_exefs/main, hactool, am.asm; /tmp/prod.keys; r2 6.1.6 + capstone installed."
