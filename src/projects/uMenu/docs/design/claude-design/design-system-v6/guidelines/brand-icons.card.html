<!-- @dsCard group="Brand" viewport="760x800" name="Icon-pack system" subtitle="Full named set per theme — emblem, status, dock, folders. Same roles, ten vocabularies." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 16px 18px; background: #0A0A14; font-family: var(--font-sans); }
  .sec { font-family: var(--font-mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
         color: var(--accent); margin: 4px 0 8px; }
  .sec:nth-of-type(2) { margin-top: 20px; }
  .grid { display: grid; gap: 5px 4px; align-items: center; }
  .gA { grid-template-columns: 74px repeat(9, 1fr); }
  .gB { grid-template-columns: 74px repeat(6, 1fr); }
  .head { font-family: var(--font-mono); font-size: 8px; letter-spacing: .04em; text-transform: uppercase;
          color: var(--text-secondary); text-align: center; padding-bottom: 2px; }
  .row { display: contents; }
  .name { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; color: var(--text-primary); }
  .dot { width: 8px; height: 8px; border-radius: 999px; background: var(--accent); box-shadow: 0 0 6px -1px var(--accent); }
  .cell { display: grid; place-items: center; height: 36px; border-radius: 7px; background: #15152E; color: var(--accent); }
  .emb { background: color-mix(in srgb, var(--accent) 12%, #15152E); }
  .g { width: 23px; height: 23px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; }
  .fill .g  { stroke-width: 2.6; }
  .glow .g  { stroke-width: 2.1; filter: drop-shadow(0 0 4px currentColor) drop-shadow(0 0 1px currentColor); }
  .line .g  { stroke-width: 1.7; }
  .pixel .g { stroke-linejoin: miter; stroke-linecap: butt; shape-rendering: crispEdges; stroke-width: 2.5; }
  .grad .g  { stroke: url(#cg); }
</style>
</head>
