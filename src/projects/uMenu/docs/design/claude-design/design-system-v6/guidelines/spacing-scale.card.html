<!-- @dsCard group="Spacing" viewport="700x170" name="Spacing scale" subtitle="4px base — the grid behind every panel" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 24px 26px; background: #0A0A14; display: flex; align-items: flex-end; gap: 16px; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .bar { width: 100%; background: linear-gradient(var(--accent), var(--brand-magenta)); border-radius: 3px; }
  .v { font-family: var(--font-mono); font-size: 10px; color: var(--text-secondary); }
  .n { font-family: var(--font-mono); font-size: 10px; color: var(--accent); }
</style>
</head>
<body>
  <div class="col" style="width:30px"><div class="bar" style="height:4px"></div><div class="n">1</div><div class="v">4</div></div>
  <div class="col" style="width:30px"><div class="bar" style="height:8px"></div><div class="n">2</div><div class="v">8</div></div>
  <div class="col" style="width:30px"><div class="bar" style="height:12px"></div><div class="n">3</div><div class="v">12</div></div>
  <div class="col" style="width:30px"><div class="bar" style="height:16px"></div><div class="n">4</div><div class="v">16</div></div>
  <div class="col" style="width:30px"><div class="bar" style="height:24px"></div><div class="n">6</div><div class="v">24</div></div>
  <div class="col" style="width:30px"><div class="bar" style="height:32px"></div><div class="n">8</div><div class="v">32</div></div>
  <div class="col" style="width:30px"><div class="bar" style="height:48px"></div><div class="n">12</div><div class="v">48</div></div>
  <div class="col" style="width:30px"><div class="bar" style="height:64px"></div><div class="n">16</div><div class="v">64</div></div>
  <div class="col" style="width:30px"><div class="bar" style="height:80px"></div><div class="n">20</div><div class="v">80</div></div>
</body>
</html>
