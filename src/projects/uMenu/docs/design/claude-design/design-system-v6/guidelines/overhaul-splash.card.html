<!-- @dsCard group="Overhaul" viewport="760x430" name="Loading splash screens" subtitle="Ten abstract splashes — no wordmark, each with a live spot for the heavy-loading wheel" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 18px; background: #0A0A14; font-family: var(--font-sans); }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .sp { position: relative; border-radius: 10px; overflow: hidden; border: 1px solid rgba(255,255,255,.08); aspect-ratio: 16/9; }
  .sp img { width: 100%; height: 100%; display: block; object-fit: cover; }
  .wheel { position: absolute; left: 50%; top: 77.5%; transform: translate(-50%,-50%);
           font-family: var(--font-mono); font-size: 22px; line-height: 1; text-shadow: 0 0 10px currentColor; }
  .tag { position: absolute; left: 10px; top: 8px; font-family: var(--font-mono); font-size: 9px; letter-spacing: .08em;
         text-transform: uppercase; color: rgba(255,255,255,.6); }
</style>
</head>
<body>
  <div class="grid" id="grid"></div>
  <script>
    const T=[["q-os","#7DD3FC"],["neon","#FF2AD0"],["minimal","#E0B86A"],["retro","#FFA83A"],["cards","#FF9A3C"],["pastel","#FBC6E4"],["dark","#FF6040"],["gradient","#A070FF"],["blueprint","#7AE0FF"],["pixel","#FFCC00"]];
    const FR=["⠋","⠙","⠹","⠸","⠼","⠴","⠦","⠧","⠇","⠏"];
    const grid=document.getElementById("grid");
    const wheels=[];
    T.forEach((t,i)=>{
      const d=document.createElement("div"); d.className="sp";
      d.innerHTML=`<img src="../assets/splash/q-os-${i}.svg" alt=""><span class="tag">${t[0]}</span><span class="wheel" style="color:${t[1]}">⠋</span>`;
      grid.appendChild(d); wheels.push(d.querySelector(".wheel"));
    });
    function tick(now){ const bi=Math.floor(now/90); for(const w of wheels) w.textContent=FR[bi%FR.length]; requestAnimationFrame(tick); }
    requestAnimationFrame(tick);
  </script>
</body>
</html>
