<!-- @dsCard group="Overhaul" viewport="760x420" name="Window frame (SVG masters)" subtitle="Scalable themed window chrome — 10 themes, 9-slice ready, exports to any size" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 18px; background: #0A0A14; font-family: var(--font-sans); }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  .cell { border-radius: 10px; overflow: hidden; border: 1px solid rgba(255,255,255,.06); background: #060610; padding: 10px; }
  .cell img { width: 100%; height: auto; display: block; }
  .lbl { font-family: var(--font-mono); font-size: 9px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-secondary); margin: 7px 2px 0; }
</style>
</head>
<body>
  <div class="grid">
    <div class="cell"><img src="../deliverables/window/q-os-0-q-os.svg" alt="Q OS"><div class="lbl">q-os · Glass</div></div>
    <div class="cell"><img src="../deliverables/window/q-os-1-neon.svg" alt="Neon"><div class="lbl">neon</div></div>
    <div class="cell"><img src="../deliverables/window/q-os-3-retro.svg" alt="Retro"><div class="lbl">retro</div></div>
    <div class="cell"><img src="../deliverables/window/q-os-7-gradient.svg" alt="Gradient"><div class="lbl">gradient</div></div>
    <div class="cell"><img src="../deliverables/window/q-os-8-blueprint.svg" alt="Blueprint"><div class="lbl">blueprint</div></div>
    <div class="cell"><img src="../deliverables/window/q-os-9-pixel.svg" alt="Pixel"><div class="lbl">pixel</div></div>
  </div>
</body>
</html>
