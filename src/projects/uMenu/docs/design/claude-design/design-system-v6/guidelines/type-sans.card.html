<!-- @dsCard group="Type" viewport="700x260" name="UI sans — IBM Plex Sans" subtitle="The interface & body scale, 11–32px" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 24px 28px; background: #0A0A14; font-family: var(--font-sans); }
  .r { display: flex; align-items: baseline; gap: 18px; padding: 5px 0; }
  .spec { width: 96px; flex: none; font-family: var(--font-mono); font-size: 10px; color: var(--accent); letter-spacing: .06em; }
  .x { color: var(--text-primary); }
</style>
</head>
<body>
  <div class="r"><span class="spec">32 / 700</span><span class="x" style="font-size:32px;font-weight:700">Reboot to Hekate</span></div>
  <div class="r"><span class="spec">24 / 600</span><span class="x" style="font-size:24px;font-weight:600">Vault — file manager</span></div>
  <div class="r"><span class="spec">19 / 600</span><span class="x" style="font-size:19px;font-weight:600">Monitor · Task Manager</span></div>
  <div class="r"><span class="spec">16 / 400</span><span class="x" style="font-size:16px;font-weight:400">Drag a window's titlebar into a corner to snap it.</span></div>
  <div class="r"><span class="spec">14 / 400</span><span class="x" style="font-size:14px;font-weight:400;color:var(--text-secondary)">Six folder tiles auto-classify every NRO on your SD card.</span></div>
  <div class="r"><span class="spec">12 / 500</span><span class="x" style="font-size:12px;font-weight:500;color:var(--text-secondary)">BATTERY 87% · WI-FI · 14:22</span></div>
</body>
</html>
