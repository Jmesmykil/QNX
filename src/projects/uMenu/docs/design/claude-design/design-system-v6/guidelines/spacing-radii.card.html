<!-- @dsCard group="Spacing" viewport="700x160" name="Radii & borders" subtitle="From 4px controls to fully-round dock dots" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 24px; background: #0A0A14; display: flex; gap: 22px; align-items: center; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .box { width: 64px; height: 64px; background: var(--surface-glass); border: 2px solid var(--accent); }
  .n { font-family: var(--font-sans); font-size: 11px; font-weight: 600; color: var(--text-primary); }
  .v { font-family: var(--font-mono); font-size: 10px; color: var(--text-secondary); }
</style>
</head>
<body>
  <div class="item"><div class="box" style="border-radius:4px"></div><div class="n">sm</div><div class="v">4px</div></div>
  <div class="item"><div class="box" style="border-radius:8px"></div><div class="n">md</div><div class="v">8px</div></div>
  <div class="item"><div class="box" style="border-radius:12px"></div><div class="n">lg</div><div class="v">12px</div></div>
  <div class="item"><div class="box" style="border-radius:18px"></div><div class="n">xl</div><div class="v">18px</div></div>
  <div class="item"><div class="box" style="border-radius:999px"></div><div class="n">full</div><div class="v">999px</div></div>
</body>
</html>
