<!-- @dsCard group="Overhaul" viewport="1280x760" name="Overhaul showcase" subtitle="Palette · selection · cursor · glyphs · wallpaper — one OS, ten outfits. Click a swatch." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../styles.css">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #fit { position: fixed; inset: 0; display: grid; place-items: center; }
  .stage { position: relative; width: 1280px; height: 720px; overflow: hidden; border-radius: 6px;
           font-family: var(--font-sans); transform-origin: center; }
  .wall { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  /* top bar */
  .topbar { position: absolute; top: 0; left: 0; right: 0; height: 40px; display: flex; align-items: center; justify-content: space-between;
            padding: 0 16px; background: color-mix(in srgb, var(--topbar-bg) 80%, transparent);
            border-bottom: 1px solid color-mix(in srgb, var(--accent) 40%, transparent); backdrop-filter: blur(8px); z-index: 5; }
  .emblem { font-family: var(--font-display); font-style: italic; font-weight: 600; font-size: 22px; color: var(--accent);
            text-shadow: 0 0 14px color-mix(in srgb, var(--accent) 55%, transparent); }
  .status { display: flex; align-items: center; gap: 14px; color: var(--text-primary); }
  .status svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .clock { font-family: var(--font-mono); font-size: 13px; }
  /* desktop folders */
  .folders { position: absolute; top: 92px; left: 60px; display: grid; grid-template-columns: repeat(3, 110px); gap: 30px 44px; z-index: 2; }
  .ftile { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .fart { position: relative; width: 92px; height: 92px; border-radius: 18px; display: grid; place-items: center;
          background: color-mix(in srgb, var(--surface-glass) 78%, transparent); border: 2px solid var(--cat); }
  .fart svg { width: 40px; height: 40px; fill: none; stroke: var(--cat); stroke-width: 2.4; stroke-linejoin: round; stroke-linecap: round; }
  .flabel { font-size: 13px; font-weight: 500; color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,.7); }
  .focused .fart { box-shadow: 0 0 0 3px var(--focus-ring), 0 0 0 6px color-mix(in srgb, var(--focus-ring) 22%, transparent),
                   0 0 20px 3px color-mix(in srgb, var(--focus-ring) 45%, transparent); }
  /* window */
  .win { position: absolute; right: 70px; top: 150px; width: 440px; height: 320px; border-radius: 12px; overflow: hidden;
         background: rgba(18,18,42,.94); border: 1px solid var(--accent); box-shadow: var(--shadow-window); backdrop-filter: blur(16px); z-index: 4; }
  .wtitle { height: 40px; display: flex; align-items: center; padding: 0 44px; background: color-mix(in srgb, var(--accent) 10%, transparent);
            border-bottom: 1px solid color-mix(in srgb, var(--accent) 16%, transparent); font-size: 14px; font-weight: 600; color: var(--text-primary); }
  .corner { position: absolute; width: 22px; height: 22px; border-radius: 999px; display: grid; place-items: center; color: #0A0A14; font-size: 14px; font-weight: 700; }
  .corner svg { width: 12px; height: 12px; stroke: #0A0A14; stroke-width: 2.4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .wbody { padding: 18px; color: var(--text-primary); }
  .whint { position: absolute; left: 0; right: 0; bottom: 0; height: 34px; display: flex; align-items: center; justify-content: center; gap: 14px;
           background: rgba(10,10,20,.5); border-top: 1px solid color-mix(in srgb, var(--accent) 12%, transparent);
           font-family: var(--font-mono); font-size: 11px; color: var(--text-secondary); }
  .key { width: 17px; height: 17px; border-radius: 999px; display: inline-grid; place-items: center; color: #0A0A14; font-size: 10px; font-weight: 700; }
  /* dock */
  .dock { position: absolute; left: 0; right: 0; bottom: 0; height: 96px; display: flex; align-items: center; justify-content: center; gap: 16px;
          background: color-mix(in srgb, var(--dock-bg) 70%, transparent); border-top: 1px solid color-mix(in srgb, var(--accent) 50%, transparent);
          backdrop-filter: blur(12px); z-index: 5; }
  .dtile { position: relative; width: 60px; height: 60px; border-radius: 14px; display: grid; place-items: center;
           background: color-mix(in srgb, var(--accent) 8%, rgba(24,24,48,.6)); border: 1px solid color-mix(in srgb, var(--accent) 18%, transparent); }
  .dtile.act { background: color-mix(in srgb, var(--accent) 18%, transparent); border-color: var(--accent); }
  .dtile svg { width: 28px; height: 28px; fill: none; stroke: var(--accent); stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; }
  .ddot { position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%); width: 5px; height: 5px; border-radius: 999px; background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  /* cursor */
  .cur { position: absolute; left: 224px; top: 150px; width: 38px; height: 38px; border-radius: 999px; z-index: 8; pointer-events: none;
         background: radial-gradient(circle, color-mix(in srgb, var(--cursor-fill) 46%, transparent) 0%, color-mix(in srgb, var(--cursor-fill) 30%, transparent) 60%, transparent 73%);
         box-shadow: 0 0 0 1px color-mix(in srgb, var(--cursor-outline) 55%, transparent), 0 0 0 2.4px var(--cursor-outline); }
  .cur::before { content:""; position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:9px; height:9px; border-radius:999px; background:var(--cursor-outline); }
  .cur::after { content:""; position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:4px; height:4px; border-radius:999px; background:var(--cursor-fill); }
  /* switcher */
  .switch { position: absolute; top: 50px; right: 14px; display: flex; flex-direction: column; gap: 7px; z-index: 9;
            background: rgba(10,10,20,.6); padding: 9px; border-radius: 10px; border: 1px solid rgba(255,255,255,.1); backdrop-filter: blur(8px); }
  .sw { width: 26px; height: 26px; border-radius: 7px; cursor: pointer; border: 2px solid transparent; }
  .sw.on { border-color: #fff; }
</style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute"><defs>
    <symbol id="wifi" viewBox="0 0 24 24"><path d="M4.5 9.5 a11 11 0 0 1 15 0"/><path d="M7.5 12.6 a7 7 0 0 1 9 0"/><circle cx="12" cy="16" r="1.1"/></symbol>
    <symbol id="bt" viewBox="0 0 24 24"><path d="M9 8 L15 16 L12 18.5 V5.5 L15 8 L9 16"/></symbol>
    <symbol id="batt" viewBox="0 0 24 24"><rect x="3" y="8" width="15" height="8" rx="2"/><path d="M20 11 v2"/><rect x="5" y="10" width="9" height="4" rx="1" fill="currentColor" stroke="none"/></symbol>
    <symbol id="pad" viewBox="0 0 24 24"><rect x="3" y="9" width="18" height="8" rx="4"/><circle cx="8" cy="13" r="1.1"/><circle cx="16" cy="13" r="1.1"/></symbol>
    <symbol id="floppy" viewBox="0 0 24 24"><path d="M5 5 H17 L19 7 V19 H5 Z"/><rect x="8" y="5" width="6" height="4"/><rect x="8" y="13" width="8" height="6"/></symbol>
    <symbol id="wrench" viewBox="0 0 24 24"><circle cx="9" cy="9" r="3.5"/><line x1="11.4" y1="11.4" x2="18" y2="18"/></symbol>
    <symbol id="gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 4 v2 M12 18 v2 M4 12 h2 M18 12 h2 M6.3 6.3 l1.4 1.4 M16.3 16.3 l1.4 1.4 M17.7 6.3 l-1.4 1.4 M7.7 16.3 l-1.4 1.4"/></symbol>
    <symbol id="qr" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M15 15 L19.5 19.5"/></symbol>
    <symbol id="qmark" viewBox="0 0 24 24"><path d="M9 9.2 a3 3 0 1 1 4.2 2.8 c-1 0.5 -1.2 1.2 -1.2 2.5"/><circle cx="12" cy="17.6" r="0.6"/></symbol>
    <symbol id="lock" viewBox="0 0 24 24"><rect x="6" y="10.5" width="12" height="8" rx="1.5"/><path d="M9 10.5 V8.5 a3 3 0 0 1 6 0 V10.5"/></symbol>
    <symbol id="display" viewBox="0 0 24 24"><rect x="4" y="5.5" width="16" height="11" rx="1.5"/><path d="M9 19.5 h6 M12 16.5 v3"/></symbol>
    <symbol id="tasks" viewBox="0 0 24 24"><rect x="4.5" y="7" width="3.5" height="3.5" rx=".5"/><rect x="4.5" y="13.5" width="3.5" height="3.5" rx=".5"/><path d="M11 8.7 h8.5 M11 15.2 h8.5"/></symbol>
    <symbol id="info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="8.2" r="0.4"/><path d="M12 11 v6"/></symbol>
    <symbol id="grid" viewBox="0 0 24 24"><rect x="5" y="5" width="5.5" height="5.5" rx=".5"/><rect x="13.5" y="5" width="5.5" height="5.5" rx=".5"/><rect x="5" y="13.5" width="5.5" height="5.5" rx=".5"/><rect x="13.5" y="13.5" width="5.5" height="5.5" rx=".5"/></symbol>
    <symbol id="resize" viewBox="0 0 24 24"><path d="M7 7 L17 17 M17 17 L17 12.5 M17 17 L12.5 17 M7 7 L7 11.5 M7 7 L11.5 7"/></symbol>
  </defs></svg>

  <div id="fit"><div class="stage" data-theme="glass" id="stage">
    <img class="wall" id="wall" src="../assets/wallpapers/q-os-0.svg" alt="">

    <div class="topbar">
      <span class="emblem" id="emblem">Q</span>
      <span class="status"><svg><use href="#wifi"/></svg><svg><use href="#bt"/></svg><svg><use href="#batt"/></svg><span class="clock">14:22</span></span>
    </div>

    <div class="folders">
      <div class="ftile focused"><div class="fart" style="--cat:var(--cat-games)"><svg><use href="#pad"/></svg></div><span class="flabel">Games</span></div>
      <div class="ftile"><div class="fart" style="--cat:var(--cat-homebrew)"><svg><use href="#floppy"/></svg></div><span class="flabel">Emulators</span></div>
      <div class="ftile"><div class="fart" style="--cat:var(--cat-custom)"><svg><use href="#wrench"/></svg></div><span class="flabel">Tools</span></div>
      <div class="ftile"><div class="fart" style="--cat:var(--cat-system)"><svg><use href="#gear"/></svg></div><span class="flabel">System</span></div>
      <div class="ftile"><div class="fart" style="--cat:var(--cat-builtin)"><svg><use href="#qr"/></svg></div><span class="flabel">Q OS</span></div>
      <div class="ftile"><div class="fart" style="--cat:var(--cat-payloads)"><svg><use href="#qmark"/></svg></div><span class="flabel">Other</span></div>
    </div>
    <div class="cur"></div>

    <div class="win">
      <div class="corner" style="background:var(--btn-close); top:9px; left:9px">×</div>
      <div class="corner" style="background:var(--btn-maximize); top:9px; right:9px">□</div>
      <div class="corner" style="background:var(--btn-minimize); bottom:9px; left:9px">–</div>
      <div class="corner" style="background:var(--accent); bottom:9px; right:9px"><svg><use href="#resize"/></svg></div>
      <div class="wtitle">About Q OS</div>
      <div class="wbody">
        <div style="font-family:var(--font-display); font-style:italic; font-size:30px; color:var(--text-primary)">Q OS uMenu</div>
        <div style="font-family:var(--font-mono); font-size:12px; color:var(--accent); margin:8px 0 16px">v3.5.0 · HOS 20.0.0 · Erista</div>
        <div style="display:grid; grid-template-columns:auto 1fr; gap:7px 16px; font-size:13px">
          <span style="color:var(--text-secondary)">Firmware</span><span>Atmosphère</span>
          <span style="color:var(--text-secondary)">Battery</span><span>87% · charging</span>
          <span style="color:var(--text-secondary)">Theme</span><span id="tname">Q OS — Liquid Glass</span>
        </div>
      </div>
      <div class="whint"><span><span class="key" style="background:var(--btn-maximize)">A</span> Launch</span><span><span class="key" style="background:var(--btn-close)">B</span> Close</span><span>Drag titlebar</span></div>
    </div>

    <div class="dock">
      <div class="dtile act"><svg><use href="#lock"/></svg><span class="ddot"></span></div>
      <div class="dtile"><svg><use href="#display"/></svg></div>
      <div class="dtile"><svg><use href="#gear"/></svg></div>
      <div class="dtile"><svg><use href="#tasks"/></svg></div>
      <div class="dtile"><svg><use href="#info"/></svg></div>
      <div class="dtile"><svg><use href="#grid"/></svg></div>
    </div>

    <div class="switch" id="switch"></div>
  </div></div>

  <script>
    const THEMES = [["glass","Q","Q OS — Liquid Glass"],["neon","⚡","Neon"],["minimal","⋮","Minimal"],["retro","◗","Retro"],["cards","♠","Cards"],["pastel","♥","Pastel"],["dark","🔥","Dark"],["gradient","▲","Gradient"],["blueprint","✛","Blueprint"],["pixel","✦","Pixel"]];
    const stage = document.getElementById("stage"), wall = document.getElementById("wall"),
          emblem = document.getElementById("emblem"), tname = document.getElementById("tname"), sw = document.getElementById("switch");
    function set(i){ const [id,em,nm]=THEMES[i]; stage.dataset.theme=id; wall.src="../assets/wallpapers/q-os-"+i+".svg";
      emblem.textContent=em; tname.textContent=nm;
      [...sw.children].forEach((c,k)=>c.classList.toggle("on",k===i)); }
    THEMES.forEach((t,i)=>{ const d=document.createElement("div"); d.className="sw"; d.dataset.theme=t[0];
      d.style.background="var(--accent)"; d.setAttribute("data-theme",t[0]); d.title=t[2];
      const probe=document.createElement("div"); probe.setAttribute("data-theme",t[0]); probe.style.cssText="position:absolute;left:-999px";
      document.body.appendChild(probe); d.style.background=getComputedStyle(probe).getPropertyValue("--accent"); probe.remove();
      d.onclick=()=>set(i); sw.appendChild(d); });
    set(0);
    // scale to fit viewport
    function fit(){ const s=Math.min(window.innerWidth/1280, window.innerHeight/720); stage.style.transform="scale("+s+")"; }
    window.addEventListener("resize",fit); fit();
  </script>
</body>
</html>
